name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check src/index.js && node --check src/scraper.js && node --check src/store.js && node --check src/notifier.js && node --check src/config.js
      - run: npm test
