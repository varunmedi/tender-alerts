name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for f in src/*.js; do node --check "$f"; done
      # Chromium is unavailable in the authoring sandbox but IS available here,
      # so browser-level fixture tests can be added without further setup.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm test
